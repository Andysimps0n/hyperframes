        #root {
          position: absolute;
          inset: 0;
          width: 1080px;

          background: #111111;
          color: #f0ece5;
        }

        #g1 {
          position: absolute;
          inset: 0;
          overflow: hidden;
        }

        /* Meter sits in the lower field so the word never lands on orange. */
        #g1_track {
          position: absolute;
          left: 50%;
          bottom: 72px;
          width: 300px;
          height: 868px;
          margin-left: -150px;
          box-sizing: border-box;
          background: #1a1a18;
          border: 1px solid #282826;
          overflow: hidden;
        }

        #g1_fill {
          position: absolute;
          left: 0;
          bottom: 0;
          display: block;
          width: 100%;
          height: 100%;
          background: #e85d26;
          transform: scaleY(0);
          transform-origin: center bottom;
          will-change: transform;
        }

        #g1_lip {
          position: absolute;
          top: 0;
          left: 0;
          right: 0;
          height: 8px;
          background: #111111;
        }

        #g1_copy {
          position: absolute;
          inset: 0;
          z-index: 2;
        }

        #g1_w1,
        #g1_w2,
        #g1_w3 {
          position: absolute;
          left: 72px;
          right: 72px;
          top: 716px;
          margin: 0;
          opacity: 0;
          visibility: hidden;
          font-family: "Jua", "IBM Plex Sans KR", sans-serif;
          font-weight: 900;
          font-size: 200px;
          line-height: 0.9;
          letter-spacing: -0.04em;
          text-align: center;
          white-space: nowrap;
          color: #f0ece5;
          transform-origin: center center;
          will-change: transform, filter, opacity;
        }

        #g1_flash {
          position: absolute;
          inset: 0;
          z-index: 3;
          background: #f0ece5;
          opacity: 0;
          pointer-events: none;
          will-change: opacity;
        }
      </style>

      <div data-hf-id="hf-4pif" id="root" data-composition-id="04-riser" data-width="1080" data-height="1920" data-duration="5.643">
        <div data-hf-id="hf-h7r5" id="g1">
          <div data-hf-id="hf-5pyh" id="g1_track">
            <div data-hf-id="hf-sggv" id="g1_fill">
              <div data-hf-id="hf-r3cj" id="g1_lip"></div>
            </div>
          </div>
          <div data-hf-id="hf-n57f" id="g1_copy">
            <p data-hf-id="hf-nawr" id="g1_w1">올라간다</p>
            <p data-hf-id="hf-75xw" id="g1_w2">비운다</p>
            <p data-hf-id="hf-cxnf" id="g1_w3">터진다</p>
          </div>
          <div data-hf-id="hf-2pre" id="g1_flash"></div>
        </div>
      </div>

      <script>
        /* Local time is track time minus the frame start, 29.582. */
        const FILL = 0.906;
        const HOLE = 2.418;
        const SLAM = 5.643;
        const GROW = 0.9;
        const DRAIN = 0.28;
        const ZOOM = 0.45;
        const PUNCH = 0.12;
        const CRASH = SLAM - ZOOM - PUNCH;

        const tl = gsap.timeline({ paused: true });

        tl.set("#g1", { autoAlpha: 1 }, 0);

        /* Directional fill: one vertical bar grows from the bottom. */
        tl.set("#g1_w1", { autoAlpha: 1, immediateRender: false }, FILL);
        tl.fromTo(
          "#g1_fill",
          { scaleY: 0 },
          { scaleY: 1, duration: GROW, ease: "power2.out", immediateRender: false },
          FILL,
        );

        /* Negative-space hold: the bar drains, then the well is removed. */
        tl.set("#g1_w1", { autoAlpha: 0, immediateRender: false }, HOLE);
        tl.set("#g1_w2", { autoAlpha: 1, immediateRender: false }, HOLE);
        tl.fromTo(
          "#g1_fill",
          { scaleY: 1 },
          { scaleY: 0, duration: DRAIN, ease: "power2.in", immediateRender: false },
          HOLE,
        );
        tl.set("#g1_track", { autoAlpha: 0, immediateRender: false }, HOLE + DRAIN);

        /* Crash zoom, then the braam punch lands on the last anchor. */
        tl.set("#g1_w2", { autoAlpha: 0, immediateRender: false }, CRASH);
        tl.set("#g1_w3", { autoAlpha: 1, immediateRender: false }, CRASH);
        tl.fromTo(
          "#g1_w3",
          { scale: 0.64, filter: "blur(4px)" },
          {
            scale: 1,
            filter: "blur(0px)",
            duration: ZOOM,
            ease: "expo.in",
            immediateRender: false,
          },
          CRASH,
        );
        tl.fromTo(
          "#g1_w3",
          { scale: 1 },
          {
            scale: 1.12,
            duration: PUNCH,
            ease: "power4.out",
            immediateRender: false,
            overwrite: "auto",
          },
          CRASH + ZOOM,
        );
        tl.fromTo(
          "#g1_flash",
          { opacity: 0 },
          { opacity: 0.55, duration: 0.05, ease: "power4.out", immediateRender: false },
          CRASH + ZOOM,
        );
        tl.fromTo(
          "#g1_flash",
          { opacity: 0.55 },
          { opacity: 0, duration: 0.07, ease: "power3.in", immediateRender: false },
          CRASH + ZOOM + 0.05,
        );
        tl.fromTo(
          "#g1_copy",
          { x: 0, y: 0 },
          { x: 7, y: 3, duration: 0.03, ease: "none", immediateRender: false, overwrite: "auto" },
          CRASH + ZOOM,
        );
        tl.fromTo(
          "#g1_copy",
          { x: 7, y: 3 },
          { x: -5, y: -2, duration: 0.03, ease: "none", immediateRender: false, overwrite: "auto" },
          CRASH + ZOOM + 0.031,
        );
        tl.fromTo(
          "#g1_copy",
          { x: -5, y: -2 },
          { x: 3, y: 1, duration: 0.03, ease: "none", immediateRender: false, overwrite: "auto" },
          CRASH + ZOOM + 0.062,
        );
        tl.fromTo(
          "#g1_copy",
          { x: 3, y: 1 },
          { x: 0, y: 0, duration: 0.03, ease: "none", immediateRender: false, overwrite: "auto" },
          CRASH + ZOOM + 0.093,
        );

        window.__timelines["04-riser"] = tl;
        tl.seek(0);
      </script>
    </template>
