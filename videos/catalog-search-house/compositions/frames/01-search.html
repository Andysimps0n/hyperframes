<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
  </head>
  <body>
    <template>
      <style>
        @font-face { font-family: "Jua"; src: url("assets/fonts/jua-400.ttf") format("truetype"); font-weight: 400; }
        @font-face { font-family: "IBM Plex Sans KR"; src: url("assets/fonts/plex-400.ttf") format("truetype"); font-weight: 400; }
        @font-face { font-family: "IBM Plex Sans KR"; src: url("assets/fonts/plex-600.ttf") format("truetype"); font-weight: 600; }
        @font-face { font-family: "IBM Plex Mono"; src: url("assets/fonts/plex-400.ttf") format("truetype"); font-weight: 500; }
        #root {
          position: absolute;
          inset: 0;
          width: 1080px;
          height: 1920px;
          overflow: hidden;
          background: #111111;
          color: #f0ece5;
          font-family: "Jua", "IBM Plex Sans KR", sans-serif;
        }

        #g1,
        #g2 {
          position: absolute;
          inset: 0;
          box-sizing: border-box;
          background: #111111;
        }

        #g2,
        #g1_period {
          opacity: 0;
          visibility: hidden;
        }

        /* g1 — typewriter stack. Slots start at height 0 so unrevealed
           words do not leave holes; opening a slot re-centers the column. */
        #g1 {
          display: flex;
          align-items: flex-start;
          justify-content: center;
          padding: 72px;
        }

        #g1_stack {
          display: flex;
          flex-direction: column;
          width: 100%;
          max-width: 936px;
        }

        .g1_slot {
          display: flex;
          align-items: center;
          height: 0;
          overflow: hidden;
        }

        .g1_word,
        #g1_period {
          display: block;
          margin: 0;
          font-weight: 900;
          font-size: 200px;
          line-height: 1.05;
          letter-spacing: -0.04em;
          white-space: nowrap;
          color: #f0ece5;
          transform-origin: left center;
        }

        #g1_keyline {
          display: flex;
          align-items: baseline;
          gap: 0.08em;
        }

        #g1_key,
        #g1_period {
          display: inline-block;
        }

        #g1_period {
          color: #e85d26;
          transform-origin: center center;
        }

        /* g2 — kinetic cascade, phrases stacked and left-aligned,
           climax centered. One phrase is on screen at a time. */
        #g2_p0,
        #g2_p1,
        #g2_climax {
          position: absolute;
          inset: 0;
          box-sizing: border-box;
          display: flex;
          padding: 72px;
          visibility: hidden;
          opacity: 0;
        }

        #g2_p0,
        #g2_p1 {
          flex-direction: column;
          align-items: flex-start;
          justify-content: center;
        }

        #g2_climax {
          flex-direction: row;
          align-items: center;
          justify-content: center;
          gap: 28px;
        }

        .g2_line,
        #g2_cword {
          display: block;
          margin: 0;
          font-weight: 900;
          letter-spacing: -0.04em;
          line-height: 1.05;
          white-space: nowrap;
        }

        .g2_line.hero,
        #g2_cword {
          font-size: 300px;
          color: #e85d26;
        }

        .g2_line.support {
          margin-top: 12px;
          font-size: 150px;
          color: #888880;
        }

        .g2_line {
          opacity: 0;
        }

        #g2_icon {
          position: relative;
          display: block;
          width: 140px;
          height: 140px;
          flex: 0 0 140px;
        }

        #g2_glyph {
          display: block;
          width: 140px;
          height: 140px;
          color: #f0ece5;
          transform-origin: 50% 50%;
        }

        #g2_glyph svg {
          display: block;
          width: 100%;
          height: 100%;
        }

        .g2_ring {
          position: absolute;
          left: 50%;
          top: 50%;
          width: 180px;
          height: 180px;
          border: 3px solid #888880;
          border-radius: 50%;
        }

        #g2_ring2 {
          border-color: #282826;
        }
      </style>

      <div data-hf-id="hf-xr7k" id="root" data-composition-id="01-search" data-width="1080" data-height="1920" data-duration="8.777">
        <div data-hf-id="hf-h7r5" id="g1">
          <div data-hf-id="hf-tpn8" id="g1_stack">
            <div data-hf-id="hf-a0fl" class="g1_slot" id="g1_s0">
              <p data-hf-id="hf-1cp5" class="g1_word" id="g1_w0">검색</p>
            </div>
            <div data-hf-id="hf-98rs" class="g1_slot" id="g1_s1">
              <p data-hf-id="hf-nx57" class="g1_word" id="g1_w1">하드</p>
            </div>
            <div data-hf-id="hf-hwnn" class="g1_slot" id="g1_s2">
              <p data-hf-id="hf-aqwo" class="g1_word" id="g1_w2">하우스</p>
            </div>
            <div data-hf-id="hf-dyjm" class="g1_slot" id="g1_s3">
              <div data-hf-id="hf-gsuz" id="g1_keyline">
                <span data-hf-id="hf-7scv" class="g1_word" id="g1_key">49초</span>
                <span data-hf-id="hf-s6av" id="g1_period">_</span>
              </div>
            </div>
          </div>
        </div>

        <div data-hf-id="hf-l5v6" id="g2">
          <div data-hf-id="hf-rlgx" id="g2_p0">
            <p data-hf-id="hf-2zgz" class="g2_line hero" id="g2_p0w0">클럽</p>
            <p data-hf-id="hf-tdnw" class="g2_line support" id="g2_p0w1">하우스</p>
          </div>
          <div data-hf-id="hf-qtt4" id="g2_p1">
            <p data-hf-id="hf-912h" class="g2_line hero" id="g2_p1w0">모던</p>
            <p data-hf-id="hf-z3dz" class="g2_line support" id="g2_p1w1">하우스</p>
          </div>
          <div data-hf-id="hf-kqat" id="g2_climax">
            <p data-hf-id="hf-nlpo" id="g2_cword">1위</p>
            <div data-hf-id="hf-gk9i" id="g2_icon">
              <span data-hf-id="hf-8ueo" class="g2_ring" id="g2_ring1"></span>
              <span data-hf-id="hf-hiaj" class="g2_ring" id="g2_ring2"></span>
              <span data-hf-id="hf-ussq" id="g2_glyph">
                <svg data-hf-id="hf-iy5k" viewBox="0 0 24 24" fill="currentColor" width="100%" height="100%">
                  <path data-hf-id="hf-lnhu" d="M5.5 2.6l13.4 7.9-5.9 1.2-1.1 5.9-6.4-15z" />
                </svg>
              </span>
            </div>
          </div>
        </div>
      </div>

      <script>
        const tl = gsap.timeline({ paused: true });

        /* Frame starts at track 0, so every anchor is already frame-local.
           Faces cycle weight and family only — Korean stays upright. */
        const BASE = '"Barlow", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif';
        const MONO =
          '"IBM Plex Mono", "Apple SD Gothic Neo", "Noto Sans KR", ui-monospace, monospace';
        const FACES = [
          { fontFamily: BASE, fontWeight: 900 },
          { fontFamily: MONO, fontWeight: 500 },
          { fontFamily: BASE, fontWeight: 700 },
          { fontFamily: MONO, fontWeight: 700 },
        ];
        const SLOT_H = 280;

        const PHRASE = [1.231, 2.111, 2.93];
        const KEYWORD_TYPE = 3.111;
        const PERIOD_AT = 3.32;
        const KEYWORD_IN = 4.992;
        const G1_END = 4.992;

        const P2 = [4.992, 6.896];
        const CLIMAX_IN = 8.59;
        const FRAME_END = 8.777;

        tl.set("#g1", { autoAlpha: 0 }, G1_END);
        tl.set("#g2", { autoAlpha: 1 }, G1_END);
        tl.set("#g2", { autoAlpha: 0 }, FRAME_END);

        tl.set("#g1_key", FACES[0], 0);

        function popSlot(slot, target, at) {
          tl.set(slot, { height: SLOT_H }, at);
          tl.fromTo(
            target,
            { autoAlpha: 0, scale: 0.92, y: 5 },
            { autoAlpha: 1, scale: 1, y: 0, duration: 0.1, ease: "back.out(2)" },
            at,
          );
        }

        popSlot("#g1_s0", "#g1_w0", PHRASE[0]);
        popSlot("#g1_s1", "#g1_w1", PHRASE[1]);
        popSlot("#g1_s2", "#g1_w2", PHRASE[2]);
        popSlot("#g1_s3", "#g1_key", KEYWORD_TYPE);

        tl.fromTo(
          "#g1_period",
          { autoAlpha: 0, scale: 0.3 },
          { autoAlpha: 1, scale: 1, duration: 0.09, ease: "back.out(3)", immediateRender: false },
          PERIOD_AT,
        );

        /* Shuffle on the beats after the keyword is on screen, then hold
           the base face. keyword.in (4.992) is that lock, on the group cut. */
        tl.set("#g1_key", FACES[1], 3.576);
        tl.set("#g1_key", FACES[2], 4.063);
        tl.set("#g1_key", FACES[0], 4.528);
        tl.set("#g1_key", FACES[0], KEYWORD_IN);

        function showPhrase(id, at, nextAt) {
          const head = id + "w0";
          const tail = id + "w1";
          tl.set(id, { autoAlpha: 1 }, at);
          tl.fromTo(
            head,
            { autoAlpha: 0 },
            { autoAlpha: 1, duration: 0.18, ease: "power2.out" },
            at,
          );
          tl.fromTo(
            tail,
            { autoAlpha: 0 },
            { autoAlpha: 1, duration: 0.18, ease: "power2.out" },
            at + 0.16,
          );
          tl.set(id, { autoAlpha: 0 }, nextAt);
        }

        showPhrase("#g2_p0", P2[0], P2[1]);
        showPhrase("#g2_p1", P2[1], CLIMAX_IN);

        tl.fromTo(
          "#g2_climax",
          { x: 1080, autoAlpha: 0 },
          { x: 0, autoAlpha: 1, duration: 0.12, ease: "power3.out" },
          CLIMAX_IN,
        );

        /* iconAt is the frame end, so the cursor finishes on the last frames
           instead of starting after the last sample. */
        const ICON_AT = 8.64;
        tl.set("#g2_icon", { autoAlpha: 0 }, 0);
        tl.set("#g2_glyph", { scale: 0.4, rotation: -8, autoAlpha: 0 }, 0);
        tl.set(
          ["#g2_ring1", "#g2_ring2"],
          { xPercent: -50, yPercent: -50, scale: 0.4, autoAlpha: 0 },
          0,
        );

        tl.fromTo(
          "#g2_icon",
          { autoAlpha: 0 },
          { autoAlpha: 1, duration: 0.1, ease: "power3.out", immediateRender: false },
          ICON_AT,
        );
        tl.fromTo(
          "#g2_glyph",
          { scale: 0.4, rotation: -8, autoAlpha: 0 },
          {
            scale: 1,
            rotation: 0,
            autoAlpha: 1,
            duration: 0.12,
            ease: "back.out(2.4)",
            immediateRender: false,
          },
          ICON_AT,
        );
        tl.fromTo(
          "#g2_ring1",
          { xPercent: -50, yPercent: -50, scale: 0.4, autoAlpha: 0.55 },
          {
            xPercent: -50,
            yPercent: -50,
            scale: 1.5,
            autoAlpha: 0,
            duration: 0.12,
            ease: "power2.out",
            immediateRender: false,
          },
          ICON_AT + 0.02,
        );
        tl.fromTo(
          "#g2_ring2",
          { xPercent: -50, yPercent: -50, scale: 0.4, autoAlpha: 0.55 },
          {
            xPercent: -50,
            yPercent: -50,
            scale: 1.5,
            autoAlpha: 0,
            duration: 0.12,
            ease: "power2.out",
            immediateRender: false,
          },
          ICON_AT + 0.06,
        );

        window.__timelines["01-search"] = tl;
        tl.seek(0);
      </script>
    </template>
  </body>
</html>
