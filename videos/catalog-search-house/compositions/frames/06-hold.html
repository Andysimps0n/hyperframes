<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
  </head>
  <body>
    <template>
      <style>
        @font-face { font-family: "Jua"; src: url("assets/fonts/jua-400.ttf") format("truetype"); font-weight: 400; }
        @font-face { font-family: "IBM Plex Sans KR"; src: url("assets/fonts/plex-400.ttf") format("truetype"); font-weight: 400; }
        @font-face { font-family: "IBM Plex Sans KR"; src: url("assets/fonts/plex-600.ttf") format("truetype"); font-weight: 600; }
        @font-face { font-family: "IBM Plex Mono"; src: url("assets/fonts/plex-400.ttf") format("truetype"); font-weight: 500; }
        #root {
          position: absolute;
          inset: 0;
          width: 1080px;
          height: 1920px;
          overflow: hidden;
          background: #111111;
          color: #f0ece5;
        }

        #g1 {
          position: absolute;
          inset: 0;
          box-sizing: border-box;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 28px;
          padding: 72px;
        }

        #g1_rule {
          display: block;
          width: 36px;
          height: 2px;
          background: #e85d26;
          flex: 0 0 auto;
        }

        #g1_copy {
          display: block;
          width: max-content;
          max-width: 100%;
          margin: 0;
          font-family: "Jua", "IBM Plex Sans KR", sans-serif;
          font-weight: 900;
          font-size: 128px;
          line-height: 1.05;
          letter-spacing: -0.03em;
          text-align: center;
          color: #f0ece5;
          transform-origin: center center;
          will-change: filter, transform, opacity;
        }
      </style>

      <div data-hf-id="hf-h0jm" id="root" data-composition-id="06-hold" data-width="1080" data-height="1920" data-duration="3">
        <div data-hf-id="hf-h7r5" id="g1">
          <div data-hf-id="hf-3qbi" id="g1_rule"></div>
          <p data-hf-id="hf-q1lv" id="g1_copy">같은 카탈로그</p>
        </div>
      </div>

      <script>
        const tl = gsap.timeline({ paused: true });

        tl.set("#g1", { autoAlpha: 1 }, 0);

        /* Blur resolves toward crisp across the opening, landing near the quiet hit. */
        tl.fromTo(
          "#g1_copy",
          { filter: "blur(36px)", scale: 1.06, opacity: 0.25 },
          {
            filter: "blur(6px)",
            scale: 1.015,
            opacity: 1,
            duration: 0.74,
            ease: "power2.out",
            immediateRender: true,
          },
          0,
        );

        /* Local 0.74 eases the last of the blur, then the mark holds to 3.0. */
        tl.fromTo(
          "#g1_copy",
          { filter: "blur(6px)", scale: 1.015 },
          {
            filter: "blur(0px)",
            scale: 1,
            duration: 0.46,
            ease: "power1.out",
            immediateRender: false,
          },
          0.74,
        );

        tl.set("#g1", { autoAlpha: 0 }, 3);

        window.__timelines["06-hold"] = tl;
        tl.seek(0);
      </script>
    </template>
  </body>
</html>
