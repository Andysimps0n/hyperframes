<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1080, height=1920">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js" integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2" crossorigin="anonymous"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #F5F7F6;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div data-hf-id="hf-wtrm" id="root" data-composition-id="main" data-start="0" data-duration="20" data-width="1080" data-height="1920">
      <div data-hf-id="hf-mowe" id="el-01-timeline" class="scene" data-composition-id="01-timeline" data-composition-src="compositions/frames/01-timeline.html" data-start="0" data-duration="4" data-track-index="0"></div>

      <div data-hf-id="hf-0oen" id="el-02-question" class="scene" data-composition-id="02-question" data-composition-src="compositions/frames/02-question.html" data-start="4" data-duration="3.5" data-track-index="1"></div>

      <div data-hf-id="hf-61cm" id="el-03-write" class="scene" data-composition-id="03-write" data-composition-src="compositions/frames/03-write.html" data-start="7" data-duration="3" data-track-index="0"></div>

      <div data-hf-id="hf-3aee" id="el-04-loop" class="scene" data-composition-id="04-loop" data-composition-src="compositions/frames/04-loop.html" data-start="10" data-duration="5.5" data-track-index="1"></div>

      <div data-hf-id="hf-wzj2" id="el-05-line" class="scene" data-composition-id="05-line" data-composition-src="compositions/frames/05-line.html" data-start="15" data-duration="3" data-track-index="0"></div>

      <div data-hf-id="hf-16e0" id="el-06-hyperframes" class="scene" data-composition-id="06-hyperframes" data-composition-src="compositions/frames/06-hyperframes.html" data-start="18" data-duration="2" data-track-index="1"></div>

      <!-- BGM -->
      <audio data-hf-id="hf-kfyu" id="el-bgm" src="assets/bgm/track.mp3" data-start="0" data-duration="20" data-track-index="11" data-volume="0.9"></audio>

      <!-- SFX -->
      <audio data-hf-id="hf-xja7" id="el-sfx-0" src="assets/sfx/whoosh.mp3" data-start="0" data-duration="1.58" data-track-index="20" data-volume="0.35"></audio>
      <audio data-hf-id="hf-gq8d" id="el-sfx-1" src="assets/sfx/whoosh.mp3" data-start="4" data-duration="1.58" data-track-index="21" data-volume="0.35"></audio>
      <audio data-hf-id="hf-1pqb" id="el-sfx-2" src="assets/sfx/keyboard-typing.mp3" data-start="7" data-duration="2.4" data-track-index="22" data-volume="0.35"></audio>
      <audio data-hf-id="hf-yipl" id="el-sfx-3" src="assets/sfx/impact.mp3" data-start="10" data-duration="5" data-track-index="23" data-volume="0.35"></audio>
      <audio data-hf-id="hf-qv2i" id="el-sfx-4" src="assets/sfx/camera-burst.mp3" data-start="18.7" data-duration="1.176" data-track-index="24" data-volume="0.35"></audio>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      // ── frame transitions (injected by transitions.mjs) ──
      (function () { var tl = window.__timelines["main"];
        tl.to("#el-02-question", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 7);
        tl.fromTo("#el-03-write", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 7);
        tl.to("#el-04-loop", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 15);
        tl.fromTo("#el-05-line", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 15);
        tl.to({}, { duration: 20 }, 0); // full-span anchor — main.duration() == composition total (Studio master duration)
      })();
    </script>
  </body>
</html>
