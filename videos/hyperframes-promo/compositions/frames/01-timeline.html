  <script>
    // Tracks arrive as a waterfall in the first 1.6s. The question is a
    // separate beat: each word blurs in, then the frame holds still.
    const FRAME = 1 / 60;
    const tl = gsap.timeline({ paused: true });

    tl.set("#timeline-kicker", { opacity: 1, y: 36 }, 0);
    tl.to("#timeline-kicker", { y: 0, duration: 0.16, ease: "power3.out" }, 0);

    const TRACK_COUNT = 12;
    const TRACK_DURATION = 0.16;
    const TRACK_GAP = 0.08;
    for (let i = 1; i <= TRACK_COUNT; i++) {
      const start = (i - 1) * TRACK_GAP;
      const selector = "#timeline-t" + i;
      tl.set(selector, { opacity: 1, y: 48 }, start);
      tl.to(selector, { y: 0, duration: TRACK_DURATION, ease: "power3.out" }, start);
    }

    const QUESTION_AT = 1.6;
    tl.set("#timeline-question", { opacity: 1 }, QUESTION_AT);

    const WORDS = ["#timeline-w1", "#timeline-w2", "#timeline-w3", "#timeline-w4", "#timeline-w5", "#timeline-w6"];
    const WORD_TEXT = ["영상", "하나", "만드는데,", "아직도", "이렇게", "하세요?"];
    WORDS.forEach((selector, index) => {
      const reveal = 0.26 + WORD_TEXT[index].length * 0.04;
      tl.fromTo(
        selector,
        { opacity: 0, filter: "blur(16px)" },
        { opacity: 1, filter: "blur(0px)", duration: reveal, ease: "power3.out", immediateRender: true },
        QUESTION_AT + index * 0.12,
      );
    });
