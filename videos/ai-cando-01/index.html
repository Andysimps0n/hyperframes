    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      // ── frame transitions (injected by transitions.mjs) ──
      (function () { var tl = window.__timelines["main"];
        tl.to("#el-01-cover", { y: -1920, duration: 0.5, ease: "power3.inOut" }, 4.5);
        tl.fromTo("#el-02-what", { y: 1920, opacity: 1 }, { y: 0, opacity: 1, duration: 0.5, ease: "power3.inOut" }, 4.5);
        tl.addLabel("hf:transition:01-cover:02-what:push-slide", 4.5);
        tl.to("#el-02-what", { y: -1920, duration: 0.5, ease: "power3.inOut" }, 9.5);
        tl.fromTo("#el-03-how", { y: 1920, opacity: 1 }, { y: 0, opacity: 1, duration: 0.5, ease: "power3.inOut" }, 9.5);
        tl.addLabel("hf:transition:02-what:03-how:push-slide", 9.5);
        tl.to("#el-03-how", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 17);
        tl.fromTo("#el-04-prompt", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 17);
        tl.addLabel("hf:transition:03-how:04-prompt:crossfade", 17);
        tl.to("#el-04-prompt", { y: -1920, duration: 0.5, ease: "power3.inOut" }, 23.5);
        tl.fromTo("#el-05-why", { y: 1920, opacity: 1 }, { y: 0, opacity: 1, duration: 0.5, ease: "power3.inOut" }, 23.5);

        tl.addLabel("hf:transition:05-why:06-message:crossfade", 30.5);

        tl.fromTo("#el-08-ending", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 39);
        tl.addLabel("hf:transition:07-proof:08-ending:crossfade", 39);
        tl.to({}, { duration: 44 }, 0); // full-span anchor — main.duration() == composition total (Studio master duration)
