      bottom: 270px;

  </style>

  <div
    id="root"
    data-composition-id="04-prompt"
    data-width="1080"
    data-height="1920"
    data-duration="7"
  >
    <svg width="0" height="0" aria-hidden="true">
      <defs>
        <filter id="n04-prompt-crayon-border" x="-8%" y="-8%" width="116%" height="116%">
          <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" seed="4" result="n" />
          <feDisplacementMap in="SourceGraphic" in2="n" scale="2.2" />
        </filter>
        <filter id="n04-prompt-crayon-line" x="-6%" y="-80%" width="112%" height="260%">
          <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="1" seed="7" result="n" />
          <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6" />
        </filter>
      </defs>
    </svg>

    <div
      id="n04-prompt-paper"
      class="clip"
      data-start="0"
      data-duration="7"
      data-track-index="0"
    ></div>
    <div
      id="n04-prompt-dots"
      class="clip"
      data-start="0"
      data-duration="7"
      data-track-index="1"
    ></div>
    <p class="n04-prompt-series">이것도 AI로 돼?</p>
    <p class="n04-prompt-handle">@crayon.sure</p>

    <div id="n04-prompt-card">
      <svg class="n04-prompt-edge" viewBox="0 0 936 380" preserveAspectRatio="none" aria-hidden="true">
        <rect
          x="8"
          y="8"
          width="920"
          height="364"
          rx="30"
          fill="none"
          stroke="#a9d3f5"
          stroke-width="10"
          filter="url(#n04-prompt-crayon-border)"
        />
      </svg>
      <div class="n04-prompt-label">프롬프트</div>
      <div class="n04-prompt-field">
        <div class="n04-prompt-wrap">
          <span id="n04-prompt-text"></span><span id="n04-prompt-caret"></span>
        </div>
      </div>
    </div>

    <div id="n04-prompt-line1" class="n04-prompt-line">
      <span class="n04-prompt-word">AI는 </span>
      <span class="n04-prompt-word">원래 </span>
      <span class="n04-prompt-word">HTML을 </span>
      <span class="n04-prompt-word">잘 </span>
      <span class="n04-prompt-word">써요</span>
    </div>

    <div id="n04-prompt-line2" class="n04-prompt-line">
      <span class="n04-prompt-word">이 </span>
      <span class="n04-prompt-word">한 </span>
      <span class="n04-prompt-word">줄이면 </span>
      <span class="n04-prompt-word">돼요</span>
      <svg class="n04-prompt-under" viewBox="0 0 100 16" preserveAspectRatio="none" aria-hidden="true">
        <line
          id="n04-prompt-underline"
          x1="1"
          y1="8"
          x2="99"
          y2="8"
          stroke="#a9d3f5"
          stroke-width="8"
          stroke-linecap="round"
          pathLength="1"
          stroke-dasharray="1"
          stroke-dashoffset="1"
          filter="url(#n04-prompt-crayon-line)"
        />
      </svg>
    </div>
  </div>

  <script>
    const fullText = "Hyperframes를 소개하는 영상을 만들어줘.";
    const chars = Array.from(fullText);
    const typeStart = 1.2;
    const typeEnd = 4.2;
    const textEl = document.getElementById("n04-prompt-text");
    const caretEl = document.getElementById("n04-prompt-caret");

    function typedText(time) {
      let count = 0;
      if (time >= typeEnd) count = chars.length;
      else if (time > typeStart) {
        const progress = (time - typeStart) / (typeEnd - typeStart);
        count = Math.ceil(progress * chars.length);
        if (count > chars.length) count = chars.length;
      }
      return chars.slice(0, count).join("");
    }

    const tl = gsap.timeline({ paused: true });

    tl.fromTo(
      "#n04-prompt-card",
      { opacity: 0, y: 24 },
      { opacity: 1, y: 0, duration: 0.42, ease: "power2.out", immediateRender: true },
      0,
    );

    const clock = { t: 0 };
    tl.to(
      clock,
      {
        t: 6.5,
        duration: 6.5,
        ease: "none",
        onUpdate: () => {
          textEl.textContent = typedText(clock.t);
          const blink = Math.sin((clock.t / 0.64) * Math.PI * 2 + Math.PI / 2);
          caretEl.style.opacity = blink > 0 ? "1" : "0";
        },
      },
      0,
    );

    const line1Times = [4.2, 4.38, 4.56, 4.74, 4.92];
    document.querySelectorAll("#n04-prompt-line1 .n04-prompt-word").forEach((word, index) => {
      tl.fromTo(
        word,
        { opacity: 0, y: 18 },
        { opacity: 1, y: 0, duration: 0.32, ease: "power3.out", immediateRender: true },
        line1Times[index],
      );
    });

    const line2Times = [4.9, 5.05, 5.2, 5.35];
    document.querySelectorAll("#n04-prompt-line2 .n04-prompt-word").forEach((word, index) => {
      tl.fromTo(
        word,
        { opacity: 0, y: 18 },
        { opacity: 1, y: 0, duration: 0.28, ease: "power3.out", immediateRender: true },
        line2Times[index],
      );
    });

    tl.fromTo(
      "#n04-prompt-underline",
      { strokeDashoffset: 1 },
      { strokeDashoffset: 0, duration: 0.42, ease: "power2.out", immediateRender: true },
      5.25,
    );

    window.__timelines = window.__timelines || {};
    window.__timelines["04-prompt"] = tl;
  </script>
</template>
