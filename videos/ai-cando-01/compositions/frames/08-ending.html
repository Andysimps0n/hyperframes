        <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" seed="7" result="noise" />
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.8" xChannelSelector="R" yChannelSelector="G" />

  <script>
    // Three beats stack and stay. Word timing is computed once from
    // character length, then fitted inside Scene 1 (0–1.6s).
    const WORD_ENTRIES = [
      { id: "n08-ending-w0", chars: 3 },
      { id: "n08-ending-w1", chars: 4 },
      { id: "n08-ending-w2", chars: 3 },
      { id: "n08-ending-w3", chars: 2 },
      { id: "n08-ending-w4", chars: 1 },
      { id: "n08-ending-w5", chars: 4 },
      { id: "n08-ending-w6", chars: 5 },
    ];

    const BASE_DURATION = 0.14;
    const SEC_PER_CHAR = 0.02;
    const SCENE1_START = 0.1;
    const SCENE1_WINDOW = 1.2;

    let cursor = 0;
    const wordTimeline = WORD_ENTRIES.map((entry) => {
      const span = BASE_DURATION + entry.chars * SEC_PER_CHAR;
      const start = cursor;
      cursor += span;
      return { id: entry.id, start: start, span: span };
    });
    const fit = SCENE1_WINDOW / cursor;

    const tl = gsap.timeline({ paused: true });

    wordTimeline.forEach((entry) => {
      tl.fromTo(
        '[id="' + entry.id + '"]',
        { opacity: 0, y: 28 },
        { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
        SCENE1_START + entry.start * fit,
      );
    });

    tl.fromTo(
      '[id="n08-ending-chip-save"]',
      { opacity: 0, scale: 0.84, y: 18 },
      { opacity: 1, scale: 1, y: 0, duration: 0.55, ease: "power3.out" },
      1.6,
    );

    tl.fromTo(
      '[id="n08-ending-chip-follow"]',
      { opacity: 0, scale: 0.84, y: 18 },
      { opacity: 1, scale: 1, y: 0, duration: 0.55, ease: "power3.out" },
      2.2,
    );

    tl.fromTo(
      '[id="n08-ending-memo"]',
      { opacity: 0, scale: 0.92, y: 16, rotation: -8 },
      { opacity: 1, scale: 1, y: 0, rotation: -4, duration: 0.65, ease: "power3.out" },
      3.2,
    );

    window.__timelines = window.__timelines || {};
    window.__timelines["08-ending"] = tl;
  </script>
