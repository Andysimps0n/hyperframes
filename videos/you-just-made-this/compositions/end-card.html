<!DOCTYPE html><!-- Customized from the caption-kinetic-slam component.
     Words slam in one at a time and stay, as two lines. -->

<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>End card</title>
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          width: 100%;
          height: 100%;
          background: #000000;
          display: flex;
          align-items: center;
          justify-content: center;
        }
        #lockup {
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 18px;
          width: 100%;
          padding: 0 160px;
        }
        .line {
          display: flex;
          justify-content: center;
          flex-wrap: nowrap;
          gap: 28px;
        }
        .word {
          display: inline-block;
          font-family: "Archivo Black", sans-serif;
          font-weight: 400;
          font-size: 104px;
          line-height: 0.95;
          letter-spacing: 0.01em;
          color: #ffffff;
          white-space: nowrap;
        }
      </style>
      <div data-hf-id="hf-abe6" id="root" data-composition-id="end-card" data-width="1920" data-height="1080" data-duration="3">
        <div data-hf-id="hf-mlav" id="lockup">
          <div data-hf-id="hf-f2nc" class="line" id="line-1"></div>
          <div data-hf-id="hf-nqj7" class="line" id="line-2"></div>
        </div>
      </div>
      <script>
        (function () {
          var LINES = [
            [
              { id: "word-you", text: "YOU", at: 0.08 },
              { id: "word-just", text: "JUST", at: 0.42 },
              { id: "word-made", text: "MADE", at: 0.76 },
              { id: "word-this", text: "THIS", at: 1.1 },
            ],
            [
              { id: "word-with", text: "WITH", at: 1.52 },
              { id: "word-hyperframes", text: "HYPERFRAMES.", at: 1.94 },
            ],
          ];

          var lineEls = [document.getElementById("line-1"), document.getElementById("line-2")];
          var words = [];

          LINES.forEach(function (line, lineIndex) {
            line.forEach(function (word) {
              var el = document.createElement("span");
              el.className = "word";
              el.id = word.id;
              el.textContent = word.text;
              lineEls[lineIndex].appendChild(el);
              words.push({ el: el, at: word.at, index: words.length });
            });
          });

          var tl = gsap.timeline({ paused: true });
          words.forEach(function (word) {
            var mode = word.index % 4;
            var from = { autoAlpha: 0 };
            if (mode === 0) from.y = -70;
            else if (mode === 1) from.x = -160;
            else if (mode === 2) from.x = 160;
            else from.scale = 0.72;

            tl.set(word.el, { autoAlpha: 0 }, 0);
            tl.fromTo(
              word.el,
              from,
              {
                x: 0,
                y: 0,
                scale: 1,
                autoAlpha: 1,
                duration: 0.24,
                ease: mode === 3 ? "back.out(1.7)" : "expo.out",
              },
              word.at,
            );
          });

          tl.seek(0);
          window.__timelines["end-card"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
